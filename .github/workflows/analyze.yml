name: Analyze

on:
  push:
    branches: [ "arena/ee9b5328-hon" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-pub lib > /tmp/analyze.log 2>&1
          CODE=$?
          cat /tmp/analyze.log
          exit $CODE

      - name: annotate analyze errors
        if: always()
        run: |
          python3 - <<'PY'
          import re
          try:
              text = open("/tmp/analyze.log", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              raise SystemExit(0)
          errors = 0
          for line in text.splitlines():
              m = re.search(r'\b(error)\b\s*\u2022\s*(.*?)\s*\u2022\s*([\w./\\-]+):(\d+)(?::(\d+))?', line)
              if m:
                  errors += 1
                  print("::error file=%s::flutter analyze: %s" % (m.group(3), m.group(2)))
          if errors:
              print("::error::flutter analyze: %d error(s) found" % errors)
          PY

      - name: build apk
        if: always()
        run: |
          set +e
          flutter build apk --release > /tmp/build.log 2>&1
          CODE=$?
          echo "---- build log tail ----"
          tail -n 100 /tmp/build.log
          exit $CODE

      - name: annotate build errors
        if: always()
        run: |
          python3 - <<'PY'
          import re
          try:
              text = open("/tmp/build.log", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              raise SystemExit(0)
          lines = text.splitlines()
          annotated = 0
          for line in lines:
              # خطاهای Kotlin: "e: /path/File.kt:12:34: message"
              m = re.match(r'\s*e:\s*(.+)$', line)
              if m and annotated < 25:
                  print("::error::kotlin: " + m.group(1).strip())
                  annotated += 1
              # خطاهای Dart از AOT: "Error: ..."
              elif re.match(r'^Error: ', line) and annotated < 25:
                  print("::error::dart: " + line.strip())
                  annotated += 1
              # فایل:خط:ستون بعد از خطای Dart
              elif re.match(r'^[\w./\\-]+\.dart:\d+:\d+', line) and annotated < 25:
                  print("::error::dart at " + line.strip())
                  annotated += 1
          # بخش "What went wrong" تا "Try:"
          try:
              start = next(i for i, l in enumerate(lines) if 'What went wrong' in l)
              end = next((i for i, l in enumerate(lines[start:], start) if 'Try:' in l), start + 20)
              for l in lines[start:end]:
                  if annotated < 35 and l.strip():
                      print("::error::gradle: " + l.strip())
                      annotated += 1
          except StopIteration:
              pass
          except Exception:
              pass
          if annotated == 0:
              print("no annotated build errors found; see log tail above")
          PY

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
