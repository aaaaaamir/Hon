name: Flutter Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

      - name: Move APK to output folder
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p apk
          cp hon/build/app/outputs/flutter-apk/app-debug.apk apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apk/app-debug.apk
          if-no-files-found: error
