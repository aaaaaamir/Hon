name: Flutter Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # با نبود signing config سفارشی، فلاتر خودش برای ریلیز از
      # کلید دیباگ استفاده می‌کنه (برای تست کافیه)
      - run: flutter build apk --release

      - name: Move APK to output folder
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p apk
          cp hon/build/app/outputs/flutter-apk/app-release.apk apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk/app-release.apk
          if-no-files-found: error
