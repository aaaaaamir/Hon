name: Flutter Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # ساخت APK ریلیز. چون keystore واقعی تنظیم نشده، فلاتر به‌صورت
      # پیش‌فرض از کلید دیباگ استفاده می‌کنه (برای تست کافیه، ولی
      # برای انتشار روی گوگل‌پلی باید بعداً کلید امضای واقعی جایگزین بشه)
      - run: flutter build apk --release --debug

      # کپی خروجی به یک پوشه‌ی مستقل بیرون از پوشه‌ی پروژه (ریشه‌ی ریپو)
      - name: Move APK to output folder
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p apk
          cp hon/build/app/outputs/flutter-apk/app-release.apk apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk/app-release.apk
          if-no-files-found: error
