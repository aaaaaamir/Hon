name: Flutter Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_project
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          
      - run: flutter pub get
      - run: flutter build apk --release 
      
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: my_project/build/app/outputs/flutter-apk/app-release.apk
